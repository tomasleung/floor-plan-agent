<svg width="1100" height="450" viewBox="0 0 1100 450" xmlns="http://www.w3.org/2000/svg">

  <style>
    .label {
      font-size: 12px;
      font-family: Arial, sans-serif;
      fill: #000;
    }

    .title {
      font-size: 14px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      fill: #000;
    }

    .box {
      stroke: #000;
      stroke-width: 1;
    }

    .arrow {
      stroke: #000;
      stroke-width: 2;
      fill: none;
    }

    .dashed {
      stroke-dasharray: 4;
    }
  </style>

  <!-- TITLE -->
  <text class="title" x="550" y="30" text-anchor="middle">
    Floor Plan Data Flow
  </text>

  <!-- INPUT IMAGE -->
  <rect class="box" x="40" y="180" width="140" height="80" rx="6" ry="6" fill="#E3F2FD"/>
  <text class="label" x="110" y="220" text-anchor="middle">Input Image</text>

  <!-- EXTRACTOR -->
  <rect class="box" x="220" y="160" width="180" height="100" rx="6" ry="6" fill="#BBDEFB"/>
  <text class="label" x="310" y="195" text-anchor="middle">Extractor Agent</text>
  <text class="label" x="310" y="215" text-anchor="middle">(LLM Controlled)</text>

  <!-- STRUCTURED JSON -->
  <rect class="box" x="440" y="180" width="170" height="80" rx="6" ry="6" fill="#E8F5E9"/>
  <text class="label" x="525" y="215" text-anchor="middle">Structured JSON</text>

  <!-- SCHEMA VALIDATION -->
  <rect class="box dashed" x="440" y="280" width="170" height="60" rx="6" ry="6" fill="#F5F5F5"/>
  <text class="label" x="525" y="315" text-anchor="middle">Schema Validation</text>

  <!-- LAYOUT -->
  <rect class="box" x="650" y="160" width="180" height="100" rx="6" ry="6" fill="#90CAF9"/>
  <text class="label" x="740" y="195" text-anchor="middle">Layout Agent</text>
  <text class="label" x="740" y="215" text-anchor="middle">(LLM Controlled)</text>

  <!-- LAYOUT JSON -->
  <rect class="box" x="870" y="180" width="160" height="80" rx="6" ry="6" fill="#E8F5E9"/>
  <text class="label" x="950" y="215" text-anchor="middle">Layout JSON</text>

  <!-- RENDER -->
  <rect class="box" x="420" y="360" width="220" height="80" rx="6" ry="6" fill="#64B5F6"/>
  <text class="label" x="530" y="395" text-anchor="middle">Render Agent</text>
  <text class="label" x="530" y="415" text-anchor="middle">(Deterministic)</text>

  <!-- SVG OUTPUT -->
  <rect class="box" x="680" y="360" width="180" height="80" rx="6" ry="6" fill="#42A5F5"/>
  <text class="label" x="770" y="395" text-anchor="middle">SVG Output</text>

  <!-- HUMAN REVIEW 1 -->
  <rect class="box" x="220" y="290" width="180" height="60" rx="6" ry="6" fill="#FFF3E0"/>
  <text class="label" x="310" y="325" text-anchor="middle">Human Review</text>

  <!-- HUMAN REVIEW 2 -->
  <rect class="box" x="650" y="290" width="180" height="60" rx="6" ry="6" fill="#FFF3E0"/>
  <text class="label" x="740" y="325" text-anchor="middle">Human Review</text>

  <!-- MAIN FLOW -->
  <line class="arrow" x1="180" y1="220" x2="220" y2="220"/>
  <polygon points="215,215 220,220 215,225" fill="#000"/>

  <line class="arrow" x1="400" y1="220" x2="440" y2="220"/>
  <polygon points="435,215 440,220 435,225" fill="#000"/>

  <!-- VALIDATION FLOW -->
  <line class="arrow" x1="540" y1="260" x2="540" y2="280"/>
  <polygon points="535,275 540,280 545,275" fill="#000"/>

  <line class="arrow" x1="610" y1="310" x2="650" y2="220"/>
  <polygon points="645,215 650,220 645,225" fill="#000"/>

  <!-- LAYOUT FLOW -->
  <line class="arrow" x1="830" y1="220" x2="870" y2="220"/>
  <polygon points="865,215 870,220 865,225" fill="#000"/>

  <!-- STRUCTURED JSON TO RENDER -->
  <line class="arrow" x1="500" y1="260" x2="500" y2="360"/>
  <polygon points="495,355 500,360 505,355" fill="#000"/>

  <!-- LAYOUT JSON TO RENDER -->
  <line class="arrow" x1="950" y1="260" x2="950" y2="340"/>
  <line class="arrow" x1="950" y1="340" x2="640" y2="400"/>
  <polygon points="647,395 640,400 647,405" fill="#000"/>

  <!-- RENDER TO SVG -->
  <line class="arrow" x1="640" y1="400" x2="680" y2="400"/>
  <polygon points="675,395 680,400 675,405" fill="#000"/>

  <!-- HUMAN REVIEW LINKS -->
  <line class="arrow dashed" x1="310" y1="260" x2="310" y2="290"/>
  <line class="arrow dashed" x1="740" y1="260" x2="740" y2="290"/>

</svg>